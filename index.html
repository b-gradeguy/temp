<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밴드 공유 테스트</title>
<h3>밴드 공유 테스트</h3>
<input type="file" id="f" accept="image/*" multiple><br><br>
<textarea id="t" rows="6" style="width:100%">[37번 지게차] 배터리 셀 점검, 3번 셀 교체</textarea><br><br>
<button id="b" style="font-size:18px;padding:12px">공유하기</button>
<pre id="log"></pre>
<script>
const log = m => document.getElementById('log').textContent += m + '\n';
log('share 지원: ' + !!navigator.share);
b.onclick = async () => {
  const files = [...f.files], text = t.value;
  const data = { text };
  if (files.length) data.files = files;
  log('파일 포함 공유 가능: ' + (navigator.canShare ? navigator.canShare(data) : '확인불가'));
  try { await navigator.share(data); log('공유 완료'); }
  catch (e) { log('오류: ' + e.name + ' / ' + e.message); }
};
</script>
